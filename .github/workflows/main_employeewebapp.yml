name: Build and deploy JAR app to Azure Web App - employeeWEbapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      - name: Check JAR
        run: |
          ls -lh target
          jar tf target/*.jar | head

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/*.jar


  deploy:

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-app


      - name: Check downloaded JAR
        run: |
          ls -lh
          jar tf *.jar | head


      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: employeeWEbapp
          slot-name: Production
          package: '*.jar'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7DA1E797EB8F498FB1A6F1AE4653F71E }}
